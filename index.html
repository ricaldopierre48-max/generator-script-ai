<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeneratè Kontni AI - TikTok & Instagram</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a73e8;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        #output {
            margin-top: 25px;
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #1a73e8;
            border-radius: 4px;
            white-space: pre-wrap;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Jeneratè Kontni AI</h1>
    <p style="text-align:center;">Kreye script, hook, captions ak hashtags an segonn!</p>

    <label for="apiKey">Antre Clé API Google Gemini ou:</label>
    <input type="password" id="apiKey" placeholder="AIzaSy...">

    <label for="topic">Antre sijè videyo ou a:</label>
    <input type="text" id="topic" placeholder="eg: 3 teknik pou fè plis kòb sou entènèt">

    <button onclick="generateContent()">🚀 Jenere Kontni</button>

    <div class="loading" id="loading">⌛ Entèlijans Atifisyèl la ap travay... Tanpri tann yon ti moman...</div>

    <div id="output"></div>
</div>

<script>
async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const outputDiv = document.getElementById('output');
    const loadingDiv = document.getElementById('loading');

    if (!apiKey) {
        alert("Tanpri antre Clé API ou an!");
        return;
    }

    if (!topic) {
        alert("Tanpri antre yon sijè pou videyo a!");
        return;
    }

    outputDiv.style.display = 'none';
    loadingDiv.style.display = 'block';

    const promptText = `Ou se yon ekspè nan kreye kontni viral sou TikTok ak Instagram Reels. Ekri yon script konplè an kreyòl ayisyen pou sijè sa a: "${topic}".
    
Tanpri bay repons lan ak estrikti sa a:
1. 🔥 HOOK (3 premye segonn pou atire moun)
2. 🎬 SCRIPT KONPLÈ (Kò videyo a)
3. 📝 CAPTION (Tèks pou mete anba videyo a)
4. #️⃣ HASHTAGS (Hashtags ki gen rapò)`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{ text: promptText }]
                }]
            })
        });

        const data = await response.json();

        loadingDiv.style.display = 'none';

        if (data.candidates && data.candidates[0].content.parts[0].text) {
            outputDiv.innerText = data.candidates[0].content.parts[0].text;
            outputDiv.style.display = 'block';
        } else {
            alert("Gen yon errè nan repons AI a. Verifye Clé API ou an.");
        }
    } catch (error) {
        loadingDiv.style.display = 'none';
        alert("Erè rezo oswa kòd API pa bon: " + error.message);
    }
}
</script>

</body>
</html>
