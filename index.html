!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeneratè Kontni AI - TikTok & Instagram</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #1a73e8;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #1557b0;
    }
    .result-box {
      margin-top: 25px;
      padding: 15px;
      background-color: #f8f9fa;
      border-left: 5px solid #1a73e8;
      border-radius: 6px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .loading {
      text-align: center;
      font-weight: bold;
      color: #f39c12;
      display: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 Jeneratè Kontni AI</h1>
  <p style="text-align: center; color: #666;">Kreye script, hook, captions ak hashtags an segonn!</p>

  <label for="apiKey">1. Antre Clé API Google Gemini ou:</label>
  <input type="password" id="apiKey" placeholder="Kole kle AIzaSy... ou a la">

  <label for="topic">2. Antre sijè videyo ou a:</label>
  <input type="text" id="topic" placeholder="Egzanp: Kòman pou w fè lajan sou entènèt an 2026">

  <button onclick="generateContent()">🚀 Jenere Kontni</button>

  <div class="loading" id="loading">⏳ Entèlijans Atifisyèl la ap travay... Tanpri tann yon ti moman...</div>

  <div class="result-box" id="result" style="display:none;"></div>
</div>

<script>
  async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const resultDiv = document.getElementById('result');
    const loadingDiv = document.getElementById('loading');

    if (!apiKey) {
      alert("Tanpri antre Clé API ou an anvan!");
      return;
    }
    if (!topic) {
      alert("Tanpri antre yon sijè videyo!");
      return;
    }

    loadingDiv.style.display = "block";
    resultDiv.style.display = "none";

    const promptText = `
Ou se yon ekspè nan kreye kontni viral pou TikTok ak Instagram Reels.
Kreye yon plan konplè nan lang Kreyòl Ayisyen sou sijè sa a: "${topic}".

Men repons ou dwe bay an detay epi an Kreyòl:

1. 🎯 HOOK FÒ (Manchèt pou atire moun nan 3 premye segonn yo):
2. 📜 SCRIPT VIDEYO (30 a 60 segonn, ak detay sou sa pou moun nan di ak aksyon pou l fè):
3. 📝 CAPTION (Tèks pou mete anba videyo a):
4. 🏷️ 5 a 10 HASHTAGS APWOPRIYE:
5. 📢 CALL-TO-ACTION (Envitasyon pou moun yo kòmante, like, oswa swiv):
6. 💡 3 LÒT IDE VIDEYO nan menm sijè sa a:
`;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: [{
            parts: [{ text: promptText }]
          }]
        })
      });

      const data = await response.json();
      loadingDiv.style.display = "none";

      if (data.candidates && data.candidates[0].content.parts[0].text) {
        resultDiv.style.display = "block";
        resultDiv.innerText = data.candidates[0].content.parts[0].text;
      } else {
        alert("Gen yon errè nan repons AI a. Verifye Clé API ou an.");
      }
    } catch (error) {
      loadingDiv.style.display = "none";
      alert("Erè koneksyon oswa Clé API envalid: " + error.message);
    }
  }
</script>

</body>
</html>
